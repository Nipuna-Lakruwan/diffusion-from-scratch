[project]
name = "diffusion-from-scratch"
version = "0.1.0"
description = "A small DDPM (denoising diffusion) written from scratch in PyTorch, trained on MNIST on an 8 GB M1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "pillow>=10",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
